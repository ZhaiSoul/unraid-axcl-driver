name: Build AXCL Driver

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Specific kernel version (e.g. 6.18.35-Unraid), leave empty for auto-detect'
        required: false
        type: string
      axcl_deb_url:
        description: 'AXCL .deb download URL'
        required: false
        type: string
        default: 'https://huggingface.co/AXERA-TECH/AXCL/resolve/main/v3.10.2/axcl_host_x86_64_V3.10.2_20251111020143_NO5046.deb'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Step 1: Checkout on host runner (Slackware container lacks libnghttp3)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Determine kernel versions to build (runs on host runner)
      - name: Determine kernel versions to build
        id: detect
        run: |
          set -e

          if [ -n "${{ inputs.kernel_version }}" ]; then
            echo "kernels=[\"${{ inputs.kernel_version }}\"]" >> $GITHUB_OUTPUT
            echo "manual=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Fetching upstream releases from ich777/unraid_kernel..."
          chmod +x scripts/detect-kernels.sh
          curl -sL "https://api.github.com/repos/ich777/unraid_kernel/releases?per_page=10" | \
            python3 -c "import json,sys; [print(r['tag_name']) for r in json.load(sys.stdin)]" | \
            bash scripts/detect-kernels.sh > /tmp/kernels.json

          KERNELS_JSON=$(cat /tmp/kernels.json)
          echo "kernels=${KERNELS_JSON}" >> $GITHUB_OUTPUT
          echo "manual=false" >> $GITHUB_OUTPUT

      # Step 3: Build drivers inside Slackware container via docker run
      - name: Build AXCL drivers in container
        if: steps.detect.outputs.kernels != '[]' && steps.detect.outputs.kernels != ''
        run: |
          set -e
          AXCL_DEB="${{ inputs.axcl_deb_url }}"
          AXCL_DEB="${AXCL_DEB:-https://huggingface.co/AXERA-TECH/AXCL/resolve/main/v3.10.2/axcl_host_x86_64_V3.10.2_20251111020143_NO5046.deb}"
          WS="${{ github.workspace }}"

          printf '%s\n' '${{ steps.detect.outputs.kernels }}' > /tmp/kernels_raw.json
          KERNEL_LIST=$(python3 -c "import json; [print(k) for k in json.load(open('/tmp/kernels_raw.json'))]")

          while IFS= read -r KVER; do
            [ -z "$KVER" ] && continue
            echo ""
            echo "=== Building AXCL driver for kernel: ${KVER} ==="
            docker run --rm --platform linux/amd64 \
              -v "${WS}:${WS}" \
              -w "${WS}" \
              -e KERNEL_VERSION="${KVER}" \
              -e AXCL_DEB_URL="${AXCL_DEB}" \
              --entrypoint bash \
              ghcr.io/ich777/unraid_kernel:gcc_14.2.0 \
              scripts/build-axcl.sh
          done <<< "$KERNEL_LIST"

      # Step 4: Commit and push (host runner)
      - name: Commit and push new packages
        if: steps.detect.outputs.kernels != '[]' && steps.detect.outputs.kernels != ''
        run: |
          set -e
          cd "${{ github.workspace }}"
          git add packages/

          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi

          echo "New files to commit:"
          git diff --cached --name-only

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          KVER_LIST=$(python3 -c "import json; print(', '.join(json.load(open('/tmp/kernels_raw.json'))))")
          git commit -m "auto: build AXCL driver for ${KVER_LIST}"
          git push origin main

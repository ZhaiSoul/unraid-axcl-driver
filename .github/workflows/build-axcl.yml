name: Build AXCL Driver

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Specific kernel version (e.g. 6.18.35-Unraid), leave empty for auto-detect'
        required: false
        type: string
      axcl_deb_url:
        description: 'AXCL .deb download URL'
        required: false
        type: string
        default: 'https://huggingface.co/AXERA-TECH/AXCL/resolve/main/v3.10.2/axcl_host_x86_64_V3.10.2_20251111020143_NO5046.deb'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ich777/unraid_kernel:gcc_14.2.0
      options: --user root
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine kernel versions to build
        id: detect
        run: |
          set -e

          # If manual trigger with specific version
          if [ -n "${{ inputs.kernel_version }}" ]; then
            KERNELS_JSON="[\"${{ inputs.kernel_version }}\"]"
            echo "kernels=${KERNELS_JSON}" >> $GITHUB_OUTPUT
            echo "manual=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Fetching upstream releases from ich777/unraid_kernel..."
          curl -sL "https://api.github.com/repos/ich777/unraid_kernel/releases?per_page=10" | \
            python3 -c "import json,sys; [print(r['tag_name']) for r in json.load(sys.stdin)]" | \
            bash scripts/detect-kernels.sh > /tmp/kernels.json

          KERNELS_JSON=$(cat /tmp/kernels.json)
          echo "kernels=${KERNELS_JSON}" >> $GITHUB_OUTPUT
          echo "manual=false" >> $GITHUB_OUTPUT

      - name: Build AXCL drivers
        if: steps.detect.outputs.kernels != '[]' && steps.detect.outputs.kernels != ''
        shell: bash
        env:
          AXCL_DEB_DEFAULT: 'https://huggingface.co/AXERA-TECH/AXCL/resolve/main/v3.10.2/axcl_host_x86_64_V3.10.2_20251111020143_NO5046.deb'
        run: |
          set -e
          chmod +x scripts/build-axcl.sh
          AXCL_DEB_URL="${{ inputs.axcl_deb_url }}"
          AXCL_DEB_URL="${AXCL_DEB_URL:-$AXCL_DEB_DEFAULT}"
          KERNELS_JSON='${{ steps.detect.outputs.kernels }}'
          python3 -c "import json,sys; [print(k) for k in json.loads('${KERNELS_JSON}')]" | while read -r KVER; do
            echo ""
            echo "=== Building for kernel: ${KVER} ==="
            export KERNEL_VERSION="${KVER}"
            export AXCL_DEB_URL="${AXCL_DEB_URL}"
            bash scripts/build-axcl.sh
          done

      - name: Commit and push new packages
        if: steps.detect.outputs.kernels != '[]' && steps.detect.outputs.kernels != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git add packages/

          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi

          echo "New files to commit:"
          git diff --cached --name-only

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          KERNELS_JSON='${{ steps.detect.outputs.kernels }}'
          KVER_LIST=$(python3 -c "import json,sys; print(', '.join(json.loads('${KERNELS_JSON}')))")
          git commit -m "auto: build AXCL driver for ${KVER_LIST}"
          git push origin main
